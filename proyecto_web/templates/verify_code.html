<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar Código</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a4a 0%, #2d4a7a 50%, #1a3a5a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon { font-size: 3.5rem; margin-bottom: 20px; }
        h1 { color: #1a2a4a; font-size: 1.4rem; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }
        .code-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 700;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        .code-input:focus { border-color: #2d4a7a; }
        .code-input::placeholder { letter-spacing: 4px; font-size: 1rem; color: #ccc; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a2a4a, #2d4a7a);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26, 42, 74, 0.3); }
        .error {
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .info {
            margin-top: 20px;
            color: #888;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .back { margin-top: 15px; }
        .back a { color: #666; font-size: 0.85rem; text-decoration: none; }
        .back a:hover { color: #1a2a4a; }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #2d4a7a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
            display: none;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1>Ingresa el código</h1>
        <p class="subtitle">Enviamos un código de verificación al email <strong>{{ masked_email }}</strong></p>

        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/verify-otp" onsubmit="showLoading()">
            <input type="hidden" name="session_id" value="{{ session_id }}">
            <input type="hidden" name="modo" value="{{ modo }}">
            <input type="text" name="code" class="code-input"
                   placeholder="000000"
                   maxlength="6"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   autocomplete="one-time-code"
                   required autofocus>
            <button type="submit" class="btn" id="btnVerify">Verificar código</button>
            <div class="spinner" id="loading"></div>
        </form>

        <p class="info">El código expira en 5 minutos. Si no lo recibes, revisa tu bandeja de spam o correo no deseado y vuelve a intentarlo.</p>

        <div class="back">
            <a href="/{{ modo }}">← Volver al inicio</a>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('btnVerify').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>
</html>
